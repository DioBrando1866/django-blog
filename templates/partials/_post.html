<div class="col-xs-12 col-sm-12">
    <div class="post">
        <div class="post-heading">
            <span>{{ post.published_at|date:"d F" }}</span>
            {% if post.image %}
            <img class="img-responsive" src="{{ post.image.url }}" alt="{{ post.title }}">
            {% endif %}
        </div>
        <div class="post-body">
            <h3><a href="{{ post.get_absolute_url }}"><strong>{{ post.title }}</strong></a></h3>
            <hr>
            <p>{{ post.content|truncatechars:300 }}</p>
        </div>
        <div class="post-footer">
            <a class="btn" href="{{ post.get_absolute_url }}">READ MORE...</a>
            <span>
                <i class="fa fa-heart sr-icons"></i> {{ post.num_likes }}
                <i class="fa fa-comments sr-icons"></i> {{ post.num_comments }}
            </span>
        </div>
    </div>
</div>
